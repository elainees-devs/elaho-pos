<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; max-width: 480px; margin: 40px auto;">
  <h2>Reset your password</h2>
  <p>Hi {{ user.first_name }},</p>
  <p>You requested a password reset for your Elaho POS account.</p>
  <p>
    <a href="{{ protocol }}://{{ domain }}/reset-password?token={{ token }}&email={{ user.email }}"
       style="display: inline-block; padding: 12px 24px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px;">
      Reset Password
    </a>
  </p>
  <p style="color: #666; font-size: 14px;">This link expires in 1 hour. If you didn't request this, ignore this email.</p>
</body>
</html>
